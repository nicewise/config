# Alacritty 配置 - 从 Xresources 迁移
# 位置: ~/.config/alacritty/alacritty.toml

[env]
TERM = "xterm-256color"

[general]
live_config_reload = true

[window]
opacity = 1.0
padding = { x = 3, y = 3 }
dynamic_padding = true
decorations = "Full"

[scrolling]
history = 3000
multiplier = 3

[font]
normal = { family = "Source Code Pro", style = "Regular" }
bold = { family = "Source Code Pro", style = "Bold" }
size = 13.5  # pixelsize=18 ≈ 13.5pt

[colors]
[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.normal]
black = "#000000"
red = "#ee0000"      # Red2
green = "#00d700"
yellow = "#ffd700"
blue = "#4169e1"     # RoyalBlue
magenta = "#ff00ff"  # Magenta2
cyan = "#00d7d7"
white = "#ffffff"

[colors.bright]
black = "#7f7f7f"    # Gray50
red = "#ff5555"
green = "#00ff00"    # Green2
yellow = "#ffff00"
blue = "#1e90ff"     # DodgerBlue
magenta = "#ff55ff"
cyan = "#00ffff"     # Cyan2
white = "#e5e5e5"    # Gray95

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750
unfocused_hollow = true

[selection]
save_to_clipboard = true

# URL 点击 - firefox 打开
[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
command = "firefox"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "O", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\\u0000-\\u001F\\u007F-\\u009F<>\"\\\\s{-}\\\\^⟨⟩`\\\\\\\\]+"

[mouse]
hide_when_typing = false

[bell]
animation = "Linear"
duration = 0

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
